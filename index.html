<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bizmate AI - small business management web app"
    />
    <title>Bizmate AI</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.setTimeout(() => {
        const app = document.querySelector('#app');
        if (!app || app.children.length > 0) return;

        app.innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,Arial,sans-serif;background:#f7f8fb;color:#172033;">
            <section style="max-width:520px;border:1px solid #d9dfeb;border-radius:8px;background:#fff;padding:28px;box-shadow:0 18px 45px rgba(20,31,52,.08);">
              <h1 style="margin:0 0 10px;font-size:28px;line-height:1.15;">Start Bizmate AI with Vite</h1>
              <p style="margin:0 0 18px;color:#586176;line-height:1.55;">
                This app uses JavaScript modules and Firebase packages, so Chrome cannot run it directly from a file path.
              </p>
              <p style="margin:0 0 8px;color:#172033;">Open it at:</p>
              <p style="margin:0 0 18px;"><a style="color:#2364d2;font-weight:700;" href="http://127.0.0.1:5173/">http://127.0.0.1:5173/</a></p>
              <p style="margin:0;color:#586176;line-height:1.55;">
                If that link is not running yet, double-click <strong>start-bizmate-ai.bat</strong> or run <strong>npm start</strong>.
              </p>
            </section>
          </main>
        `;
      }, 700);
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
